<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইসলামিক ফাউন্ডেশন</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f4f7f4;
}
header {
  background: #07843b;
  color: white;
  text-align: center;
  padding: 25px;
}
main {
  max-width: 700px;
  margin: 25px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
}
h2 {
  color: #07843b;
  text-align: center;
}
.photo {
  width: 140px;
  height: 160px;
  background: #e5eee8;
  margin: 20px auto;
  display: grid;
  place-items: center;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td {
  border: 1px solid #ddd;
  padding: 12px;
}
td:first-child {
  background: #edf5ef;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
<h1>ইসলামিক ফাউন্ডেশন</h1>
<p>কর্মকর্তা ও কর্মচারীদের তথ্য</p>
</header>
<main>
<div class="card">
<h2>কর্মকর্তার পরিচিতি</h2>
<div class="photo">ছবি</div>
<table>
<tr><td>নাম</td><td>আপনার নাম</td></tr>
<tr><td>পদবি</td><td>আপনার পদবি</td></tr>
<tr><td>অফিস</td><td>ইসলামিক ফাউন্ডেশন</td></tr>
<tr><td>ইমেইল</td><td>আপনার ইমেইল</td></tr>
<tr><td>মোবাইল</td><td>আপনার নম্বর</td></tr>
</table>
</div>
</main>
</body>
</html>
